services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dnafix
      POSTGRES_PASSWORD: dnafix-local-only
      POSTGRES_DB: dnafix
    ports:
      - "5432:5432"
    volumes:
      - dnafix-postgres:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25
    depends_on:
      - postgres
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: dnafix
      POSTGRES_PWD: dnafix-local-only
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"

volumes:
  dnafix-postgres:
